# Optional. Use this instead of the CloudNativePG cluster to keep a SQLite file on a volume. See README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: modwatch-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
