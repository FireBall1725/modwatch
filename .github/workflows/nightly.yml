name: Nightly

# Every merge to main publishes an image and nothing else: no git tag, no
# GitHub Release, no Discord post.
#
#   docker pull ghcr.io/fireball1725/modwatch:nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    permissions:
      contents: read
      packages: write
      # git-cliff lists PRs for the job summary; a private repo refuses that without this.
      pull-requests: read
    uses: FireBall1725/workflows/.github/workflows/release-container.yml@v1
    with:
      image: ghcr.io/fireball1725/modwatch
      channel: nightly
    secrets: inherit
