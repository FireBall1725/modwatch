# Change the class and host to yours. Modwatch has no login of its own, so keep it on a private network
# or put authentication in front of it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modwatch
spec:
  ingressClassName: nginx
  rules:
    - host: modwatch.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modwatch
                port:
                  name: http
