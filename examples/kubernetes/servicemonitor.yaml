# Optional, for the Prometheus Operator. Add it to kustomization.yaml to use it.
# Modwatch serves its metrics at /metrics, and they can be switched off on the Settings page.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: modwatch
  labels:
    app.kubernetes.io/name: modwatch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: modwatch
  endpoints:
    - port: http
      path: /metrics
      interval: 5m
